name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm 10 only warns about ignored dependency build scripts; pnpm 12 fails the install.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `pnpm build` type-checks both packages (backend `tsc`, frontend `tsc -b`).
      - name: Build
        run: pnpm build

      # Backend tests use in-process PGlite and frontend tests use MSW, so no secrets are needed.
      - name: Test
        run: pnpm test
